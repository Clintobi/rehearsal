[package]
name = "rehearsal_gate"
version = "0.1.0"
description = "Token-2022 transfer hook: pauses a launch token while the stock it trades against is halted"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "rehearsal_gate"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "0.32.1"
anchor-spl = { version = "0.32.1", default-features = false, features = ["token_2022"] }
spl-transfer-hook-interface = "0.10"
spl-tlv-account-resolution = "0.10"
spl-discriminator = "0.4"
rehearsal_guard = { path = "../rehearsal_guard", features = ["cpi"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
