[package]
name = "solana-convert"
version = "0.1.0"
edition = "2021"

# Host tool: converts the SP1 v6 Groth16 proof + verifying key into the uncompressed,
# big-endian form Solana's alt_bn128 syscalls expect, and verifies it off-chain first.

[dependencies]
groth16-solana = "0.2.0"
ark-bn254 = "0.4.0"
ark-ff = "0.4.2"
ark-serialize = "0.4.2"
sha2 = "0.10"
hex = "0.4"
thiserror = "1"

[workspace]
